version: '3.8'

services:
  soc-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc_client_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - UV_THREADPOOL_SIZE=16
      - SESSION_SECRET=${SESSION_SECRET:-soc_client_dashboard_session_secret_2026_super_hardened_32char_key}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-soc_client_dashboard_session_secret_2026_super_hardened_32char_key}
    networks:
      - soc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  soc_network:
    driver: bridge
