version: '3.8'

services:
  soc-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soc_client_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - soc_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  soc_network:
    driver: bridge
