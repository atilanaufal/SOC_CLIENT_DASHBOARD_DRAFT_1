# ==============================================================================
# Nginx Reverse Proxy Configuration for SOC Client Dashboard (HTTPS Production)
# ==============================================================================

limit_req_zone $binary_remote_addr zone=soc_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=soc_login_limit:10m rate=3r/s;

upstream nextjs_upstream {
    server 127.0.0.1:3005 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# 1. Redirect HTTP Port 80 to HTTPS (Port 443)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server (Port 443 & Port 3000)
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    listen 3000 ssl http2;
    listen [::]:3000 ssl http2;
    server_name _;

    # Redirect non-SSL HTTP request on SSL port (e.g. http://host:3000 -> https://host:3000)
    error_page 497 https://$host:$server_port$request_uri;

    # SSL Certificates
    ssl_certificate /etc/ssl/asoc-dashboard/server.crt;
    ssl_certificate_key /etc/ssl/asoc-dashboard/server.key;

    # SSL Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Client body size
    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files
    location /public/ {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }

    # Rate limiting for auth endpoints
    location /api/auth/login {
        limit_req zone=soc_login_limit burst=5 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Rate limiting for API routes
    location /api/ {
        limit_req zone=soc_api_limit burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Default proxy to Next.js
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
